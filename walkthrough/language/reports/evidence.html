<!doctype html><meta charset="utf-8"><title>Neuron report</title>
<p style="font:15px system-ui;padding:32px;color:#777">Loading the recorded report…</p><script>
(async()=>{try{const r=await fetch("evidence.html.gz");if(!r.ok)throw Error('Could not load the report.');let html=await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close();}catch(e){document.body.textContent=e.message}})();</script>
